[project]
name = "ford-bib"
version = "0.1.0"
description = "FORD docs environment: ford plus the mdx_bib citation extension"
requires-python = ">=3.10"
dependencies = [
    "ford>=7.0.0",
    "mdx_bib",
]

[tool.uv]
# Setting constraint-dependencies controls the versions of modules that are
# installed as dependencies for other modules. Here we require >= specific
# versions that fix vulnerabilities.
constraint-dependencies = ["soupsieve>=4.0.0"]
override-dependencies = [
    "markdown>=3.8.1", # fixes CVE-2025-69534, not officially supported by ford>=7.0.0
]

[tool.uv.sources]
# mdx_bib is not on PyPI
mdx_bib = { git = "https://github.com/darwindarak/mdx_bib", rev = "3f9061e76ca9338dfd86b58b8e041dce966cf084" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "PL", "RUF"]
ignore = ["PLR2004", "PLR0912", "PLR0913", "B028"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "auto"
